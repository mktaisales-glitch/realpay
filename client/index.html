<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Michroma&family=Montserrat:wght@500;600;700&display=swap"
    />
    <link rel="stylesheet" href="/css/realpay.css" />
    <title>RealPay · Pay for the work, not the promise</title>
    <meta
      name="description"
      content="Milestone payments for any job. PayPal holds the money for each milestone; an AI inspector checks the proof of work before anything is paid."
    />
    <script type="module" src="/js/home.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="logo" href="/" aria-label="RealPay home">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#003087" />
          <path
            d="M9 17.5l4.5 4.5L23 11"
            fill="none"
            stroke="#ffffff"
            stroke-width="3.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        RealPay
      </a>
      <span class="secured">
        <span class="secured-dot" aria-hidden="true"></span>
        <span>Built on PayPal · sandbox</span>
      </span>
    </header>

    <div class="container">
      <main id="flow">
        <section class="tf">
          <p class="tf-kicker">Milestone payments · built on PayPal</p>
          <h1 class="tf-q">Pay for the work, not the promise.</h1>
          <p class="tf-help">Loading…</p>
        </section>
      </main>

      <footer class="footer">
        <span>
          RealPay · built for the PayPal AI Hackathon 2026 · open source under
          the MIT licence
        </span>
        <span>
          Sandbox demo: no real money moves. RealPay is not affiliated with
          PayPal.
        </span>
      </footer>
    </div>
  </body>
</html>
